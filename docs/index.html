<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dziennik Obecności — KTS Gliwice</title>
  <!--
    To jest plik STRONY, którą serwuje Apps Script (doGet wczytuje ją
    z GitHub Pages i podaje jako Web App). Normalny tor: użytkownik
    otwiera adres wdrożenia /exec → Google pokazuje okienko logowania
    → ta strona działa w trybie aplikacji (google.script.run).

    Jeśli ktoś otworzy TEN plik bezpośrednio (adres tmjwk.github.io/…),
    app.js przekieruje go na /exec — tu nie ma ani sesji Google, ani
    danych (zamierzone: GitHub = hosting plików, nie apka).
  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><div class="ekran-pelny"><div class="spinner"></div><p>Ładowanie…</p></div></div>
  <script src="app.js"></script>
</body>
</html>
