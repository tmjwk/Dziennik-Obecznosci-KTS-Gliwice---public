<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dziennik Obecności — KTS Gliwice</title>
  <!-- r38: favicon = piłeczka klubowa (favicon.svg strony klubu; docelowo
       publish wgra własną kopię — na wypadek awarii hostowania klubu
       trzymamy plik przy sobie jako favicon.svg) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    /* r38: paleta 60-30-10 klubowa (system projektowy strony klubu,
     * tmjwk.github.io/kts-gliwice-working-repo-public):
     *  60% neutralne — biel/chmura/mgiełka + grafit/granat/stal,
     *  30% podstawowy — niebieski klubowy #0057B8 (WCAG AA: 6.9:1 z bielą),
     *  10% akcent — pomarańcz #FF6B35 = PIŁECZKA (favicon klubu); od r40
     * też WYPEŁNIENIE kafla w trakcie zapisu (funkcjonalne, nie dekoracja).
     * Funkcjonalne: zieleń #166534 (ramka kafla obecnego), czerwień #B91C1C
     * (kafel w trakcie usuwania), błąd #DC2626, info #64748B. Kontrasty:
     * tekst ≥4.5:1, duże/ikony ≥3:1
     * (audyt r38_audit_kontrastow.py; odcienie kafli — r40_kolory_kafli.py;
     * spisy w WORKLOG r38 i r40). Zielony topbar (#0b6e4f, era v0.1–v0.5)
     * ustąpił niebieskiemu klubowemu. */
    :root {
      --tlo: #F5F7FA;         /* 60%: chmura — tło strony */
      --karta: #FFFFFF;       /* 60%: biel — karty/kaflowe */
      --tekst: #0F1B2D;       /* 60%: grafit — tekst główny (17.3:1) */
      --szary: #5A6A7E;       /* 60%: stal — tekst drugorzędny (5.5:1) */
      --akcent: #0057B8;      /* 30%: niebieski klubowy */
      --akcent-c: #FFFFFF;    /* tekst na akcencie (6.9:1) */
      --granat: #1A2433;      /* 60%: granat — pill „leci", ciemne panele */
      --pomarancz: #FF6B35;   /* 10%: piłeczka + kafel w trakcie zapisu (r40) */
      --pomarancz-ramka: #C2410C; /* obramowanie kafla „zapis" — 4.8:1 z tłem strony (samo wypełnienie ma tylko 2.6:1) */
      --obecny-tlo: #B9E3C9;  /* kafel obecny (r40; L* 86,7 — jaśniejszy od pomarańczu) */
      --obecny-ramka: #166534;/* obramowanie kafla obecnego (5.1:1 z wypełnieniem) */
      --usun: #B91C1C;        /* kafel w trakcie usuwania (L* 40 — najciemniejszy stan) */
      --usun-ramka: #991B1B;  /* obramowanie kafla „usuwanie" */
      --obrys-usun: #7F1D1D;  /* obwódka licznika 2/3 („jeszcze jedno tapnięcie usunie") */
      --linia: #DBE3EC;       /* 60%: mgiełka — linie/ramki */
      --blad: #DC2626;        /* funkcjonalny: przegrana/błąd */
      --info: #64748B;        /* funkcjonalny: remis/info */
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      background: var(--tlo); color: var(--tekst);
      font-size: 16px; line-height: 1.35;
      min-height: 100vh; min-height: 100dvh;
    }
    button { font-family: inherit; }

    /* ---------- pasek górny (30%: niebieski klubowy) ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--akcent); color: var(--akcent-c);
      padding: 8px 12px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    /* r37: JEDEN topbar dla wszystkich szerokości (przegląd UI 8 punktów):
     * pill monitora odpycha resztę w prawo, potem kompaktowa data, sort
     * jednym przyciskiem ⇅, lupa 🔍 (rozwija szukaj w drugim wierszu)
     * i „👥 Członkowie" (na ≤640px chowane CSS-em — tam od r29 siedzi
     * w pasku na dole ekranu). Bez tytułu „Obecność", bez pola szukaj
     * w pierwszym wierszu, bez przełącznika A→Z. */
    .topbar .rzad1 { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    /* r39: pill MONITORA OBECNOŚCI „X/Y obecnych" (lewa = ustawieni
     * lokalnie, prawa = potwierdzeni w arkuszu — patrz monitorPrzesylania
     * w app.js). Neutralny (mgiełka + grafit, 13.3:1), gdy wszystko
     * przesłane; klasa .leci = granat z białym tekstem (14.6:1) — „coś
     * jeszcze w rurce". Delikatny puls zwraca oko. */
    .topbar .licznik {
      margin-right: auto; font-size: .88rem; background: var(--linia);
      color: var(--granat);
      padding: 3px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
      transition: background .2s, color .2s;
    }
    .topbar .licznik.leci {
      background: var(--granat); color: #FFFFFF;
      animation: pill-puls 1.4s ease-in-out infinite;
    }
    @keyframes pill-puls {
      0%, 100% { box-shadow: 0 0 0 0 rgba(26,36,51,.55); }
      50% { box-shadow: 0 0 0 4px rgba(26,36,51,.25); }
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar .licznik.leci { animation: none; }
    }
    .btn-ikona {
      background: rgba(255,255,255,.14); color: var(--akcent-c);
      border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
      min-width: 44px; min-height: 40px; padding: 4px 10px; font-size: .85rem;
      cursor: pointer; flex-shrink: 0; white-space: nowrap;
    }
    .btn-ikona:active { background: rgba(255,255,255,.3); }
    /* r37: data KOMPAKTOWA wszędzie (punkt 3) — mniejsza czcionka i
     * węższy padding niż r27; emoji 📅 tylko na dużych ekranach (≥1024px),
     * gdzie nie zabiera miejsca */
    .btn-data { display: flex; align-items: center; gap: 0; background: rgba(255,255,255,.14); color: var(--akcent-c); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 3px 6px; min-height: 40px; }
    /* r42: przeglądany dzień ≠ dziś — wyraźny pomarańczowy sygnał
     * (wczorajszy dzień nie może wyglądać jak bieżący) */
    .btn-data.data-inna { background: rgba(255,107,53,.22); border-color: #FF6B35; }
    .btn-data.data-inna .data-input { color: #FFB38A; font-weight: 600; }
    input[type="date"].data-input {
      background: transparent; color: var(--akcent-c); border: none;
      font-size: .8rem; font-family: inherit; min-height: 34px;
      color-scheme: dark; width: 104px; padding: 0 2px;
    }
    @media (min-width: 1024px) {
      .btn-data { padding: 4px 8px; }
      .topbar .ikona-data { display: inline; font-size: .9rem; }
      .topbar .btn-data .data-input { font-size: .85rem; width: auto; }
    }
    .szukaj {
      flex: 1 1 130px; min-width: 110px;
      background: rgba(255,255,255,.92); border: none; border-radius: 8px;
      padding: 8px 10px; font-size: .95rem; min-height: 40px;
    }
    /* r37: drugi wiersz topbara (szukaj rozwijane lupą) — dotąd tylko
     * mobile (r29), teraz WSZĘDZIE; .otwarty pokazuje wiersz */
    .rzad2-mobilny { display: none; margin-top: 6px; }
    .rzad2-mobilny.otwarty { display: flex; }
    .rzad2-mobilny .szukaj { display: block; flex: 1 1 auto; width: 100%; min-width: 0; }
    .btn-szukaj-mobilny.on { background: rgba(255,255,255,.92); color: var(--akcent); }
    /* lupa/sort zawsze widoczne (były mobile-only w r29) */
    .btn-szukaj-mobilny, .btn-sort-mobilny { display: inline-flex; align-items: center; }
    .btn-sort-mobilny { padding: 4px 10px; font-size: .85rem; white-space: nowrap; }
    .btn-szukaj-mobilny { min-width: 44px; padding: 4px 8px; }
    @media (max-width: 640px) {
      /* telefon: wszystko jak wyżej, tylko ciaśniej i bez „👥 Członkowie"
       * w topbarze (od r29 siedzi w stałym pasku na dole ekranu) */
      .topbar .rzad1 { gap: 5px; }
      .topbar .licznik { font-size: .8rem; padding: 3px 8px; }
      .topbar #btn-czlonkowie { display: none; }
      .btn-sort-mobilny { padding: 4px 8px; font-size: .8rem; }
      .topbar .btn-data { padding: 3px 4px; }
      .topbar .btn-data .data-input { font-size: .78rem; min-height: 32px; width: 96px; }
    }

    /* ---------- zakładki grup ---------- */
    .grupy {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 6px;
      scrollbar-width: none;
    }
    .grupy::-webkit-scrollbar { display: none; }
    .grupy button {
      flex: 0 0 auto; background: var(--karta); color: var(--tekst);
      border: 1px solid var(--linia); border-radius: 999px;
      padding: 8px 14px; font-size: .88rem; min-height: 42px; cursor: pointer;
    }
    .grupy button.on { background: var(--akcent); color: var(--akcent-c); border-color: var(--akcent); font-weight: 700; }
    /* r24: przycisk ＋ (dodaj/edytuj grupy z apki) — wyróżniony, ale nie myli
     * się z grupą: kropkowany obrys, akcent dopiero na hover/aktywności */
    .grupy button.grupa-nowa {
      border-style: dashed; border-color: var(--akcent); color: var(--akcent);
      background: transparent; font-weight: 700;
    }

    /* ---------- lista zawodników: siatka kafli ---------- */
    /* r40: kafel to dwa słowa, więc kolumna może być wąska — 108 px.
     * Efekt: 3 kafle w wierszu na telefonach od 360 px (dotąd 2), 6 w pasie
     * 720 px na desktopie (dotąd 4); kafel ma 56 px wysokości zamiast 76.
     * Słowo dłuższe niż kolumna: najpierw zmniejsza się czcionka tej linii
     * (dopasujTekstKafli w app.js), a dopiero skrajnie długie nazwisko
     * łamie się — z myślnikiem, gdy przeglądarka ma polski słownik
     * dzielenia (hyphens: auto), inaczej w środku (overflow-wrap);
     * nigdy nie wychodzi poza kafel. */
    /* 120 px u dołu = wysokość stopki + luz (stopka jest przyklejona);
     * gdy wisi dymek błędu, app.js powiększa ten odstęp (patrz .ponow) */
    .lista {
      padding: 4px 8px 120px; max-width: 720px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 6px; align-items: stretch;
    }
    .kafel {
      display: flex; flex-direction: column; justify-content: center;
      background: var(--karta); color: var(--tekst);
      border: 1px solid var(--linia); border-radius: 10px;
      padding: 8px 6px; min-height: 56px; min-width: 0;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .15s, border-color .15s, color .15s;
      width: 100%; text-align: left; font-size: .95rem; line-height: 1.25; margin: 0;
    }
    /* naciśnięcie: przyciemnienie działa na każdym wypełnieniu (białym,
     * zielonym, pomarańczowym, czerwonym) — stąd filtr, nie kolor tła */
    .kafel:active { filter: brightness(.93); }
    .kafel .nazwa { display: block; min-width: 0; }
    .kafel .nazwa b, .kafel .nazwa span {
      display: block; overflow-wrap: anywhere;
      hyphens: auto; -webkit-hyphens: auto;
    }
    /* pomiar szerokości naturalnej słowa (dopasujTekstKafli): przez moment
     * bez zawijania, żeby odczytać, ile tekstu naprawdę potrzebuje */
    .lista.pomiar .kafel .nazwa b, .lista.pomiar .kafel .nazwa span { white-space: nowrap; }

    /* ---------- r40: STANY KAFLA — wypełnienie niesie stan ----------
     *  biały         nieobecny, nic nie czeka          (prawda arkusza)
     *  zielony       obecny                            (prawda arkusza)
     *  pomarańczowy  zapis obecności leci/czeka w kolejce
     *  czerwony      usunięcie obecności leci/czeka w kolejce
     * Odcienie dobrane skryptem r40_kolory_kafli.py: kolejne stany różnią
     * się JASNOŚCIĄ (L* 100 / 87 / 63 / 40), więc da się je uporządkować
     * bez rozpoznawania barw (ślepota barwna czerwono-zielona, słabe
     * światło, monochromatyczny ekran) — pary sąsiednie ≥ dE 15 także po
     * symulacji deuteranopii i protanopii. Tekst: grafit na bieli, zieleni
     * i pomarańczu (≥ 6.1:1), biały na czerwoni (6.5:1).
     * Kolejność reguł ma znaczenie: zapis/usun NADPISUJĄ zielony kafel
     * obecny, bo od tapnięcia do odpowiedzi serwera kafel mówi, co się
     * dzieje (intencja), a nie to, co jest w arkuszu. */
    .kafel.obecny { background: var(--obecny-tlo); border-color: var(--obecny-ramka); }
    .kafel.zapis  { background: var(--pomarancz); border-color: var(--pomarancz-ramka); }
    .kafel.usun   { background: var(--usun); border-color: var(--usun-ramka); color: #FFFFFF; }

    /* W LOCIE (wpis właśnie leci): kafel nieczuły (disabled), a o pracy
     * informuje pulsująca obwódka w kolorze intencji — kafel zachowuje
     * pełną wyrazistość (do v0.5 było wygaszenie opacity .55). Obwódka
     * rośnie do 4 px, czyli mniej niż odstęp między kaflami (6 px). */
    .kafel.zapis { --obwodka: 255, 107, 53; }
    .kafel.usun  { --obwodka: 185, 28, 28; }
    .kafel.wlocie {
      cursor: wait; pointer-events: none;
      box-shadow: 0 0 0 3px rgba(var(--obwodka), .45);
      animation: kafel-puls 1.1s ease-in-out infinite;
    }
    @keyframes kafel-puls {
      0%, 100% { box-shadow: 0 0 0 0 rgba(var(--obwodka), .6); }
      50% { box-shadow: 0 0 0 4px rgba(var(--obwodka), .3); }
    }
    /* .synchronizacja (czeka w kolejce, kafel klikalny) nie ma własnego
     * rysunku: to ten sam kolor co „w locie", tylko bez obwódki i pulsu. */

    /* LICZNIK USUWANIA UZBROJONY (2 z 3 tapów): ciemnoczerwona obwódka
     * WEWNĘTRZNA na kolorze kafla — widoczna na zieleni, pomarańczu i
     * bieli (≥ 3.5:1 z każdym z nich). Znika po 2 s bez tapa albo 3. tapem
     * (wtedy kafel robi się czerwony). */
    .kafel.potwierdz { box-shadow: inset 0 0 0 3px var(--obrys-usun); }

    /* BŁĄD operacji (sieć/biznesowy): kafel od razu wraca do koloru prawdy
     * arkusza, a czerwona poświata gaśnie w ciągu BLYK_BLEDU_MS. Czerwony
     * STAŁY kafel znaczy „usuwanie", więc błąd nie może sobie go
     * przywłaszczyć — kto i co poszło nie tak, mówi snackbar „Ponów". */
    .kafel.blad { animation: kafel-blad .8s ease-out 1; }
    @keyframes kafel-blad {
      from { box-shadow: inset 0 0 0 200px rgba(220, 38, 38, .5); }
      to   { box-shadow: inset 0 0 0 200px rgba(220, 38, 38, 0); }
    }
    /* redukcja ruchu (a11y): zamiast pulsu stała obwódka „w locie",
     * zamiast gasnącej poświaty stała czerwona ramka błędu (grubsza niż
     * obwódka licznika, żeby się nie myliły) */
    @media (prefers-reduced-motion: reduce) {
      .kafel.wlocie { animation: none; }
      .kafel.blad { animation: none; box-shadow: inset 0 0 0 5px var(--blad); }
    }

    /* ---------- dymek „Ponów" ---------- */
    /* r40: SNACKBAR nad stopką. Do v0.5 był ostatnim wierszem siatki —
     * przy długiej liście wisiał poniżej ekranu, a o błędzie mówił
     * głównie znacznik na kaflu („!" przez 3 s). Od r40 kafel po błędzie
     * od razu wraca do koloru prawdy (krótki błysk), więc o błędzie musi
     * mówić dymek — i to tam, gdzie użytkownik go zobaczy: przypięty nad
     * stopką niezależnie od przewinięcia listy. Dolny odstaw ustawia
     * dymekBledu() wg wysokości stopki; a żeby dymek niczego trwale nie
     * zasłaniał, lista dostaje wtedy tyle miejsca u dołu, by dało się
     * przewinąć wszystkie kafle ponad niego (dopasujMiejscePodDymkiem). */
    .ponow {
      position: fixed; left: 50%; transform: translateX(-50%);
      width: min(720px, calc(100% - 16px)); z-index: 11;
      margin: 0; padding: 10px 12px; border-radius: 10px;
      background: #FDEAEA; border: 1px solid var(--blad); color: var(--tekst);
      font-size: .9rem; display: flex; gap: 10px; align-items: center;
      box-shadow: 0 4px 14px rgba(15, 27, 45, .18);
    }
    .ponow span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .ponow button {
      flex-shrink: 0; background: var(--blad); color: #fff; border: none;
      border-radius: 8px; padding: 8px 14px; font-size: .9rem; cursor: pointer;
    }

    /* r25: baner rozjazdu wersji (serwer starszy niż strona).
     * r38: żółć reklamowa → info #64748B z palety funkcjonalnej. */
    .baner-wersji {
      grid-column: 1 / -1;
      margin: 0 0 8px; padding: 10px 12px; border-radius: 10px;
      background: var(--tlo); border: 1px solid var(--info); color: var(--info);
      font-size: .85rem; line-height: 1.45;
    }

    /* r34: baner dostępnej aktualizacji (auto-reload wstrzymany kolejką).
     * r38: odcienie Google → niebieski klubowy (30%). */
    .baner-aktualizacji {
      grid-column: 1 / -1;
      margin: 0 0 8px; padding: 10px 12px; border-radius: 10px;
      background: var(--linia); border: 1px solid var(--akcent); color: var(--tekst);
      font-size: .85rem; line-height: 1.45;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      justify-content: space-between;
    }
    .baner-aktualizacji span { flex: 1 1 240px; }
    .baner-aktualizacji button {
      background: var(--akcent); color: #fff; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: .85rem; cursor: pointer; font-weight: 700;
    }

    /* ---------- stopka ---------- */
    .stopka {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--karta); border-top: 1px solid var(--linia);
      padding: 6px 14px calc(8px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }
    .stopka .wiersz { display: flex; gap: 8px; justify-content: center; width: 100%; }
    .stopka button {
      flex: 1 1 0; max-width: 240px;
      background: var(--tlo); color: var(--tekst);
      border: 1px solid var(--linia); border-radius: 10px;
      padding: 12px 8px; font-size: .92rem; cursor: pointer; min-height: 48px;
    }
    .stopka button.on { background: var(--akcent); color: var(--akcent-c); border-color: var(--akcent); font-weight: 700; }
    .wersja { text-align: center; color: var(--szary); font-size: .75rem; padding: 0 0 4px; }

    /* ---------- modalne ---------- */
    .tlo-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 30;
    }
    @media (min-width: 640px) { .tlo-modal { align-items: center; } }
    .modal {
      background: var(--karta); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 560px; padding: 18px 16px 20px;
      max-height: 88vh; overflow-y: auto;
    }
    @media (min-width: 640px) { .modal { border-radius: 16px; } }
    .modal h2 { margin: 0 0 14px; font-size: 1.1rem; }
    .modal label { display: block; font-size: .85rem; color: var(--szary); margin: 12px 0 4px; }
    .modal input, .modal select {
      width: 100%; padding: 12px 10px; font-size: 1rem; font-family: inherit;
      border: 1px solid var(--linia); border-radius: 10px; background: #fff; color: var(--tekst);
    }
    .modal .przyciski { display: flex; gap: 10px; margin-top: 18px; }
    .modal .przyciski button { flex: 1; border-radius: 10px; border: none; padding: 13px 10px; font-size: 1rem; cursor: pointer; min-height: 48px; }
    .btn-glowny { background: var(--akcent); color: var(--akcent-c); font-weight: 700; }
    .btn-drugi { background: var(--tlo); color: var(--tekst); border: 1px solid var(--linia) !important; }
    .btn-usun { background: #FDEAEA; color: var(--blad); }

    /* lista w modalu członków */
    .wiersz-czlonka {
      display: flex; align-items: center; gap: 10px; padding: 11px 4px;
      border-bottom: 1px solid var(--linia);
    }
    .wiersz-czlonka .dane { flex: 1 1 auto; overflow: hidden; }
    .wiersz-czlonka .dane small { color: var(--szary); display: block; }
    .wiersz-czlonka.nieaktywny .dane { color: var(--szary); text-decoration: line-through; }
    .wiersz-czlonka .akcje { display: flex; gap: 6px; }
    .wiersz-czlonka .akcje button {
      background: var(--tlo); border: 1px solid var(--linia); border-radius: 8px;
      padding: 8px 10px; font-size: .8rem; cursor: pointer; min-height: 40px;
    }
    .oplucie { font-size: .78rem; color: var(--szary); margin-top: 4px; }
    .lista > .oplucie { grid-column: 1 / -1; text-align: center; }

    /* ---------- ekrany specjalne ---------- */
    .ekran-pelny {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; gap: 12px;
    }
    .ekran-pelny h1 { font-size: 1.25rem; margin: 0; }
    .ekran-pelny p { color: var(--szary); margin: 0; max-width: 420px; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid var(--linia); border-top-color: var(--akcent);
      animation: obrot 1s linear infinite;
    }
    @keyframes obrot { to { transform: rotate(360deg); } }
    .blad-tekst { color: var(--blad); }

    /* ---------- logowanie (Google Identity Services) ---------- */
    /* r38: piłeczka klubowa (10% akcentu — pomarańcz) zamiast emoji 🏓:
     * autorski znak KTS (korona 5 gwiazdek, KTS 40+), w kolorze
     * pomarańczowym z granatowym konturem (kontrast na jasnym tle
     * zapewnia obrys #1A2433 — audyt r38). */
    .logowanie .logo {
      width: 72px; height: 72px; margin-bottom: 4px;
    }
    .logowanie .logo svg { width: 100%; height: 100%; display: block; }
    .logowanie h1 { font-size: 1.45rem; }
    .logowanie p { margin: 0; }
    .btn-google {
      display: inline-flex; align-items: center; gap: 10px;
      background: #fff; color: var(--tekst); border: 1px solid var(--linia);
      border-radius: 10px; padding: 12px 22px; font-size: 1rem; font-weight: 600;
      cursor: pointer; box-shadow: 0 1px 3px rgba(15,27,45,.15);
      min-height: 48px;
    }
    .btn-google:active { background: var(--tlo); }
    .btn-google .g { width: 20px; height: 20px; flex: 0 0 auto; }
    .przycisk-w-srodku { margin-top: 14px; }
    .link-tryb { background: none; border: none; color: var(--szary); font-size: .8rem; text-decoration: underline; cursor: pointer; padding: 8px; }
    /* r28: „Wyloguj" w stopce — subtelny link, nie przydźwiga paska */
    .link-wyloguj { background: none; border: none; color: var(--szary); font-size: .8rem; text-decoration: underline; cursor: pointer; padding: 0; font-weight: 400; }
  </style>
</head>
<body>
  <div id="app"><div class="ekran-pelny"><div class="spinner"></div><p>Ładowanie…</p></div></div>

  <!-- logowanie kontem Google (GIS) — token idzie do API Apps Script,
       tam weryfikacja podpisu (Google) + aud (Client ID strony) + biała
       lista w arkuszu. Strona = frontend żyjący na GitHub Pages. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js?v=v0.6.2"></script>
  <script src="app.js?v=v0.6.2"></script>
</body>
</html>
