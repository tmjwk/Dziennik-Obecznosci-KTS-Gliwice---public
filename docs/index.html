<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dziennik Obecności — KTS Gliwice</title>
  <style>
    :root {
      --tlo: #f4f6f8;
      --karta: #ffffff;
      --tekst: #1c2733;
      --szary: #6b7a89;
      --akcent: #0b6e4f;
      --akcent-c: #ffffff;
      --obecny: #0b6e4f;
      --ostrz: #b3541e;
      --linia: #dde4ea;
      --blad: #b3261e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      background: var(--tlo); color: var(--tekst);
      font-size: 16px; line-height: 1.35;
      min-height: 100vh; min-height: 100dvh;
    }
    button { font-family: inherit; }

    /* ---------- pasek górny ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--akcent); color: var(--akcent-c);
      padding: 8px 12px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .topbar .rzad1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    /* r27: JEDEN wiersz — tytuł odpycha resztę w prawo; szukaj zjada
     * wolną przestrzeń, ale NIE wypycha braci z wiersza (min-width mały);
     * na telefonie zawija się naturalnie do 2 linii */
    .topbar .tytul { font-weight: 700; font-size: 1.02rem; margin-right: auto; }
    .topbar .licznik { font-size: .88rem; background: rgba(255,255,255,.16); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .btn-ikona {
      background: rgba(255,255,255,.14); color: var(--akcent-c);
      border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
      min-width: 44px; min-height: 40px; padding: 4px 10px; font-size: .85rem;
      cursor: pointer;
    }
    .btn-ikona:active { background: rgba(255,255,255,.3); }
    /* r27: rzad2 zlikwidowany — wszystko w rzad1; reguła zostaje na
     * wypadek starszych renderów członków (szukaj w drugim wierszu) */
    .rzad2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .btn-data { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.14); color: var(--akcent-c); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 5px 8px; min-height: 40px; font-size: .95rem; }
    input[type="date"].data-input {
      background: transparent; color: var(--akcent-c); border: none;
      font-size: .95rem; font-family: inherit; min-height: 36px; color-scheme: dark;
    }
    .szukaj {
      flex: 1 1 130px; min-width: 110px;
      background: rgba(255,255,255,.92); border: none; border-radius: 8px;
      padding: 8px 10px; font-size: .95rem; min-height: 40px;
    }
    @media (max-width: 640px) {
      /* r29: telefon — JEDEN rządek topbara: „Obecność 3/4" · 📅(input)
       * · ⇅ Imię · 🔍 (rozwija szukaj w drugim wierszu). Oszczędzamy
       * miejsce: licznik bez słowa „obecnych", sort jednym przełącznikiem,
       * szukaj za lupą, „Członkowie" znikają z topbara (są w stałym pasku
       * na dole ekranu, pod listą). Desktop (r27) — bez zmian. */
      .topbar .rzad1 { gap: 5px; flex-wrap: nowrap; }
      .topbar .tytul { margin-right: 0; font-size: .92rem; }
      .topbar .licznik { margin-right: auto; font-size: .8rem; padding: 3px 8px; flex-shrink: 0; }
      /* licznik: wariant krótki (desktopowy „… obecnych" ukryty) */
      .licznik .pelny { display: none; }
      /* desktopowe warianty na telefonie ukryte… */
      .topbar .szukaj, .topbar #btn-czlonkowie, .topbar .przelacznik { display: none; }
      /* …a ich mobilne odpowiedniki pokazane */
      .btn-szukaj-mobilny, .btn-sort-mobilny { display: inline-flex; align-items: center; flex-shrink: 0; }
      .btn-sort-mobilny { padding: 4px 8px; font-size: .8rem; white-space: nowrap; }
      .btn-szukaj-mobilny { min-width: 40px; padding: 4px 8px; }
      .btn-szukaj-mobilny.on { background: rgba(255,255,255,.92); color: var(--akcent); }
      /* natywny input daty — kompaktowo (systemowy picker Androida/iOS);
       * emoji 📅 chowamy (samo pole pokazuje datę) */
      .topbar .btn-data { gap: 0; padding: 3px 6px; }
      .topbar .ikona-data { display: none; }
      .topbar .btn-data .data-input { font-size: .78rem; min-height: 32px; width: 96px; padding: 0 2px; }
      /* drugi wiersz topbara: pole szukaj (rozwijane lupą) */
      .rzad2-mobilny { display: none; margin-top: 6px; }
      .rzad2-mobilny.otwarty { display: flex; }
      .rzad2-mobilny .szukaj { display: block; flex: 1 1 auto; width: 100%; min-width: 0; }
    }
    /* r29: mobilny rząd szukaj istnieje w DOM tylko dla mobile — poza
     * media query nigdy niewidoczny (desktop i tablet go nie renderują) */
    .rzad2-mobilny { display: none; }
    .przelacznik { display: flex; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; overflow: hidden; }
    .przelacznik button {
      background: transparent; color: var(--akcent-c); border: none;
      padding: 6px 10px; min-height: 38px; font-size: .82rem; cursor: pointer;
    }
    .przelacznik button.on { background: rgba(255,255,255,.92); color: var(--akcent); font-weight: 700; }

    /* ---------- zakładki grup ---------- */
    .grupy {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 6px;
      scrollbar-width: none;
    }
    .grupy::-webkit-scrollbar { display: none; }
    .grupy button {
      flex: 0 0 auto; background: var(--karta); color: var(--tekst);
      border: 1px solid var(--linia); border-radius: 999px;
      padding: 8px 14px; font-size: .88rem; min-height: 42px; cursor: pointer;
    }
    .grupy button.on { background: var(--akcent); color: var(--akcent-c); border-color: var(--akcent); font-weight: 700; }
    /* r24: przycisk ＋ (dodaj/edytuj grupy z apki) — wyróżniony, ale nie myli
     * się z grupą: kropkowany obrys, akcent dopiero na hover/aktywności */
    .grupy button.grupa-nowa {
      border-style: dashed; border-color: var(--akcent); color: var(--akcent);
      background: transparent; font-weight: 700;
    }

    /* ---------- lista zawodników: siatka 2–3 kolumny (ekran 9:16) ---------- */
    .lista {
      padding: 4px 10px 120px; max-width: 720px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px; align-items: stretch;
    }
    .kafel {
      display: flex; flex-direction: column; align-items: stretch; gap: 2px;
      background: var(--karta); border: 1px solid var(--linia);
      border-radius: 12px; padding: 10px 10px 8px; min-height: 76px;
      cursor: pointer; user-select: none;
      transition: background .15s, border-color .15s;
      width: 100%; text-align: left; font-size: 1rem; margin: 0;
    }
    .kafel:active { background: #eef2f4; }
    .kafel .wiersz-nazwy { display: flex; align-items: center; gap: 8px; }
    .kafel .nazwa { flex: 1 1 auto; overflow: hidden; }
    .kafel .nazwa b { font-size: .95rem; display: block; line-height: 1.15; overflow-wrap: anywhere; }
    .kafel .status {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid var(--linia); color: transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700;
    }
    .kafel .status.usun { width: auto; padding: 0 8px; border-radius: 999px; font-size: .68rem; }
    .kafel .grupa-etykieta {
      font-size: .7rem; color: var(--szary); text-align: right;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .kafel.obecny { background: #e7f4ee; border-color: var(--obecny); }
    .kafel.obecny .status { background: var(--obecny); border-color: var(--obecny); color: #fff; }
    .kafel.potwierdz .status { background: var(--ostrz); border-color: var(--ostrz); color: #fff; font-size: .78rem; }
    .kafel.potwierdz { border-color: var(--ostrz); background: #fdf1e7; }
    /* r33: kropka „…" kafla czekającego WIDOCZNA — do v0.4.0 .status
     * dziedziczył color:transparent (bazowy krąg) i „…" nie było
     * w ogóle widać; teraz przerywana ramka + znak w akcencie */
    .kafel.synchronizacja .status {
      border-style: dashed; border-color: var(--akcent);
      color: var(--akcent); background: #eef6f1;
    }
    .kafel.blad { border-width: 2px; }

    /* ---------- r32: maszyna stanów kafla (model pesymistyczny) ----------
     * W LOCIE = blokada transakcji: kafel nieczuły (disabled), wygaszony,
     * status pulsuje (użytkownik widzi „pracuję", a nie „zawieszony").
     * W KOLEJCE = kropka przerywana, kafel klikalny (zmiana zdania).
     * BŁĄD = czerwony błysk statusu (wygasa sam, patrz BLYK_BLEDU_MS). */
    .kafel.wlocie {
      opacity: .55; cursor: wait; pointer-events: none;
      animation: kafel-puls 1.1s ease-in-out infinite;
    }
    .kafel.wlocie .status {
      border-color: var(--akcent); color: var(--akcent);
      animation: status-puls 1.1s ease-in-out infinite;
    }
    .kafel.wlocie-usun .status { border-color: var(--ostrz); color: var(--ostrz); }
    /* obecny+wlocie: kafel ZOSTAJE zielony (prawda arkusza), puls i
     * wygaszenie sygnalizują blokadę — kolejność reguł ma znaczenie */
    .kafel.wlocie.obecny { background: #e7f4ee; border-color: var(--obecny); }
    @keyframes kafel-puls {
      0%, 100% { opacity: .55; }
      50% { opacity: .8; }
    }
    @keyframes status-puls {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    /* redukcja ruchu (a11y): puls dla ruchliwo jest zbędny */
    @media (prefers-reduced-motion: reduce) {
      .kafel.wlocie, .kafel.wlocie .status { animation: none; }
    }
    .kafel.blad .status {
      background: var(--blad); border-color: var(--blad); color: #fff;
    }
    .kafel.blad { border-color: var(--blad); background: #fdecea; }

    /* ---------- dymek „Ponów" ---------- */
    .ponow {
      grid-column: 1 / -1;
      margin: 8px 0 0; padding: 10px 12px; border-radius: 10px;
      background: #fdecea; border: 1px solid var(--blad); color: var(--blad);
      font-size: .9rem; display: flex; gap: 10px; align-items: center;
    }
    .ponow button {
      margin-left: auto; background: var(--blad); color: #fff; border: none;
      border-radius: 8px; padding: 8px 14px; font-size: .9rem; cursor: pointer;
    }

    /* r25: baner rozjazdu wersji (serwer starszy niż strona) */
    .baner-wersji {
      grid-column: 1 / -1;
      margin: 0 0 8px; padding: 10px 12px; border-radius: 10px;
      background: #fff7e0; border: 1px solid #e6c96a; color: #6b5b1e;
      font-size: .85rem; line-height: 1.45;
    }

    /* r34: baner dostępnej aktualizacji (auto-reload wstrzymany kolejką) */
    .baner-aktualizacji {
      grid-column: 1 / -1;
      margin: 0 0 8px; padding: 10px 12px; border-radius: 10px;
      background: #e8f0fe; border: 1px solid #7aa7f0; color: #1f3a70;
      font-size: .85rem; line-height: 1.45;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      justify-content: space-between;
    }
    .baner-aktualizacji span { flex: 1 1 240px; }
    .baner-aktualizacji button {
      background: #1f5fc4; color: #fff; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: .85rem; cursor: pointer; font-weight: 700;
    }

    /* ---------- stopka ---------- */
    .stopka {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--karta); border-top: 1px solid var(--linia);
      padding: 6px 14px calc(8px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }
    .stopka .wiersz { display: flex; gap: 8px; justify-content: center; width: 100%; }
    .stopka button {
      flex: 1 1 0; max-width: 240px;
      background: var(--tlo); color: var(--tekst);
      border: 1px solid var(--linia); border-radius: 10px;
      padding: 12px 8px; font-size: .92rem; cursor: pointer; min-height: 48px;
    }
    .stopka button.on { background: var(--akcent); color: var(--akcent-c); border-color: var(--akcent); font-weight: 700; }
    .wersja { text-align: center; color: var(--szary); font-size: .75rem; padding: 0 0 4px; }

    /* ---------- modalne ---------- */
    .tlo-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 30;
    }
    @media (min-width: 640px) { .tlo-modal { align-items: center; } }
    .modal {
      background: var(--karta); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 560px; padding: 18px 16px 20px;
      max-height: 88vh; overflow-y: auto;
    }
    @media (min-width: 640px) { .modal { border-radius: 16px; } }
    .modal h2 { margin: 0 0 14px; font-size: 1.1rem; }
    .modal label { display: block; font-size: .85rem; color: var(--szary); margin: 12px 0 4px; }
    .modal input, .modal select {
      width: 100%; padding: 12px 10px; font-size: 1rem; font-family: inherit;
      border: 1px solid var(--linia); border-radius: 10px; background: #fff; color: var(--tekst);
    }
    .modal .przyciski { display: flex; gap: 10px; margin-top: 18px; }
    .modal .przyciski button { flex: 1; border-radius: 10px; border: none; padding: 13px 10px; font-size: 1rem; cursor: pointer; min-height: 48px; }
    .btn-glowny { background: var(--akcent); color: var(--akcent-c); font-weight: 700; }
    .btn-drugi { background: var(--tlo); color: var(--tekst); border: 1px solid var(--linia) !important; }
    .btn-usun { background: #fdecea; color: var(--blad); }

    /* lista w modalu członków */
    .wiersz-czlonka {
      display: flex; align-items: center; gap: 10px; padding: 11px 4px;
      border-bottom: 1px solid var(--linia);
    }
    .wiersz-czlonka .dane { flex: 1 1 auto; overflow: hidden; }
    .wiersz-czlonka .dane small { color: var(--szary); display: block; }
    .wiersz-czlonka.nieaktywny .dane { color: var(--szary); text-decoration: line-through; }
    .wiersz-czlonka .akcje { display: flex; gap: 6px; }
    .wiersz-czlonka .akcje button {
      background: var(--tlo); border: 1px solid var(--linia); border-radius: 8px;
      padding: 8px 10px; font-size: .8rem; cursor: pointer; min-height: 40px;
    }
    .oplucie { font-size: .78rem; color: var(--szary); margin-top: 4px; }
    .lista > .oplucie { grid-column: 1 / -1; text-align: center; }

    /* ---------- ekrany specjalne ---------- */
    .ekran-pelny {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; gap: 12px;
    }
    .ekran-pelny h1 { font-size: 1.25rem; margin: 0; }
    .ekran-pelny p { color: var(--szary); margin: 0; max-width: 420px; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid var(--linia); border-top-color: var(--akcent);
      animation: obrot 1s linear infinite;
    }
    @keyframes obrot { to { transform: rotate(360deg); } }
    .blad-tekst { color: var(--blad); }

    /* ---------- logowanie (Google Identity Services) ---------- */
    .logowanie .logo {
      width: 64px; height: 64px; border-radius: 18px; background: var(--akcent);
      color: #fff; font-size: 1.9rem; display: flex; align-items: center;
      justify-content: center; margin-bottom: 4px;
    }
    .logowanie h1 { font-size: 1.45rem; }
    .logowanie p { margin: 0; }
    .btn-google {
      display: inline-flex; align-items: center; gap: 10px;
      background: #fff; color: #3c4043; border: 1px solid #dadce0;
      border-radius: 10px; padding: 12px 22px; font-size: 1rem; font-weight: 600;
      cursor: pointer; box-shadow: 0 1px 3px rgba(60,64,67,.2);
      min-height: 48px;
    }
    .btn-google:active { background: #f1f3f4; }
    .btn-google .g { width: 20px; height: 20px; flex: 0 0 auto; }
    .przycisk-w-srodku { margin-top: 14px; }
    .link-tryb { background: none; border: none; color: var(--szary); font-size: .8rem; text-decoration: underline; cursor: pointer; padding: 8px; }
    /* r28: „Wyloguj" w stopce — subtelny link, nie przydźwiga paska */
    .link-wyloguj { background: none; border: none; color: var(--szary); font-size: .8rem; text-decoration: underline; cursor: pointer; padding: 0; font-weight: 400; }
  </style>
</head>
<body>
  <div id="app"><div class="ekran-pelny"><div class="spinner"></div><p>Ładowanie…</p></div></div>

  <!-- logowanie kontem Google (GIS) — token idzie do API Apps Script,
       tam weryfikacja podpisu (Google) + aud (Client ID strony) + biała
       lista w arkuszu. Strona = frontend żyjący na GitHub Pages. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js?v=v0.4.3"></script>
  <script src="app.js?v=v0.4.3"></script>
</body>
</html>
