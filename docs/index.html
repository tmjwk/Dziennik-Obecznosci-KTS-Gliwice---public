<!DOCTYPE html>
<html lang="pl">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dziennik Obecności — KTS Gliwice</title>
  <style>
    :root {
      --tlo: #f4f6f8;
      --karta: #ffffff;
      --tekst: #1c2733;
      --szary: #6b7a89;
      --akcent: #0b6e4f;
      --akcent-c: #ffffff;
      --obecny: #0b6e4f;
      --ostrz: #b3541e;
      --linia: #dde4ea;
      --blad: #b3261e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      background: var(--tlo); color: var(--tekst);
      font-size: 16px; line-height: 1.35;
      min-height: 100vh; min-height: 100dvh;
    }
    button { font-family: inherit; }

    /* ---------- pasek górny ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--akcent); color: var(--akcent-c);
      padding: 8px 12px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .topbar .rzad1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .topbar .tytul { font-weight: 700; font-size: 1.02rem; margin-right: auto; }
    .topbar .licznik { font-size: .88rem; background: rgba(255,255,255,.16); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .btn-ikona {
      background: rgba(255,255,255,.14); color: var(--akcent-c);
      border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
      min-width: 44px; min-height: 40px; padding: 4px 10px; font-size: .85rem;
      cursor: pointer;
    }
    .btn-ikona:active { background: rgba(255,255,255,.3); }
    .rzad2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .btn-data { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.14); color: var(--akcent-c); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 5px 8px; min-height: 40px; font-size: .95rem; }
    input[type="date"].data-input {
      background: transparent; color: var(--akcent-c); border: none;
      font-size: .95rem; font-family: inherit; min-height: 36px; color-scheme: dark;
    }
    .szukaj {
      flex: 1 1 130px; min-width: 120px;
      background: rgba(255,255,255,.92); border: none; border-radius: 8px;
      padding: 8px 10px; font-size: .95rem; min-height: 40px;
    }
    .przelacznik { display: flex; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; overflow: hidden; }
    .przelacznik button {
      background: transparent; color: var(--akcent-c); border: none;
      padding: 6px 10px; min-height: 38px; font-size: .82rem; cursor: pointer;
    }
    .przelacznik button.on { background: rgba(255,255,255,.92); color: var(--akcent); font-weight: 700; }

    /* ---------- zakładki grup ---------- */
    .grupy {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 6px;
      scrollbar-width: none;
    }
    .grupy::-webkit-scrollbar { display: none; }
    .grupy button {
      flex: 0 0 auto; background: var(--karta); color: var(--tekst);
      border: 1px solid var(--linia); border-radius: 999px;
      padding: 8px 14px; font-size: .88rem; min-height: 42px; cursor: pointer;
    }
    .grupy button.on { background: var(--akcent); color: var(--akcent-c); border-color: var(--akcent); font-weight: 700; }

    /* ---------- lista zawodników: siatka 2–3 kolumny (ekran 9:16) ---------- */
    .lista {
      padding: 4px 10px 120px; max-width: 720px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px; align-items: stretch;
    }
    .kafel {
      display: flex; flex-direction: column; align-items: stretch; gap: 2px;
      background: var(--karta); border: 1px solid var(--linia);
      border-radius: 12px; padding: 10px 10px 8px; min-height: 76px;
      cursor: pointer; user-select: none;
      transition: background .15s, border-color .15s;
      width: 100%; text-align: left; font-size: 1rem; margin: 0;
    }
    .kafel:active { background: #eef2f4; }
    .kafel .wiersz-nazwy { display: flex; align-items: center; gap: 8px; }
    .kafel .nazwa { flex: 1 1 auto; overflow: hidden; }
    .kafel .nazwa b { font-size: .95rem; display: block; line-height: 1.15; overflow-wrap: anywhere; }
    .kafel .status {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid var(--linia); color: transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700;
    }
    .kafel .status.usun { width: auto; padding: 0 8px; border-radius: 999px; font-size: .68rem; }
    .kafel .grupa-etykieta {
      font-size: .7rem; color: var(--szary); text-align: right;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .kafel.obecny { background: #e7f4ee; border-color: var(--obecny); }
    .kafel.obecny .status { background: var(--obecny); border-color: var(--obecny); color: #fff; }
    .kafel.potwierdz .status { background: var(--ostrz); border-color: var(--ostrz); color: #fff; font-size: .78rem; }
    .kafel.potwierdz { border-color: var(--ostrz); background: #fdf1e7; }
    .kafel.synchronizacja .status { border-style: dashed; }
    .kafel.blad { border-width: 2px; }

    /* ---------- dymek „Ponów" ---------- */
    .ponow {
      grid-column: 1 / -1;
      margin: 8px 0 0; padding: 10px 12px; border-radius: 10px;
      background: #fdecea; border: 1px solid var(--blad); color: var(--blad);
      font-size: .9rem; display: flex; gap: 10px; align-items: center;
    }
    .ponow button {
      margin-left: auto; background: var(--blad); color: #fff; border: none;
      border-radius: 8px; padding: 8px 14px; font-size: .9rem; cursor: pointer;
    }

    /* ---------- stopka ---------- */
    .stopka {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--karta); border-top: 1px solid var(--linia);
      padding: 6px 14px calc(8px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }
    .stopka .wiersz { display: flex; gap: 8px; justify-content: center; width: 100%; }
    .stopka button {
      flex: 1 1 0; max-width: 240px;
      background: var(--tlo); color: var(--tekst);
      border: 1px solid var(--linia); border-radius: 10px;
      padding: 12px 8px; font-size: .92rem; cursor: pointer; min-height: 48px;
    }
    .stopka button.on { background: var(--akcent); color: var(--akcent-c); border-color: var(--akcent); font-weight: 700; }
    .wersja { text-align: center; color: var(--szary); font-size: .75rem; padding: 0 0 4px; }

    /* ---------- modalne ---------- */
    .tlo-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 30;
    }
    @media (min-width: 640px) { .tlo-modal { align-items: center; } }
    .modal {
      background: var(--karta); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 560px; padding: 18px 16px 20px;
      max-height: 88vh; overflow-y: auto;
    }
    @media (min-width: 640px) { .modal { border-radius: 16px; } }
    .modal h2 { margin: 0 0 14px; font-size: 1.1rem; }
    .modal label { display: block; font-size: .85rem; color: var(--szary); margin: 12px 0 4px; }
    .modal input, .modal select {
      width: 100%; padding: 12px 10px; font-size: 1rem; font-family: inherit;
      border: 1px solid var(--linia); border-radius: 10px; background: #fff; color: var(--tekst);
    }
    .modal .przyciski { display: flex; gap: 10px; margin-top: 18px; }
    .modal .przyciski button { flex: 1; border-radius: 10px; border: none; padding: 13px 10px; font-size: 1rem; cursor: pointer; min-height: 48px; }
    .btn-glowny { background: var(--akcent); color: var(--akcent-c); font-weight: 700; }
    .btn-drugi { background: var(--tlo); color: var(--tekst); border: 1px solid var(--linia) !important; }
    .btn-usun { background: #fdecea; color: var(--blad); }

    /* lista w modalu członków */
    .wiersz-czlonka {
      display: flex; align-items: center; gap: 10px; padding: 11px 4px;
      border-bottom: 1px solid var(--linia);
    }
    .wiersz-czlonka .dane { flex: 1 1 auto; overflow: hidden; }
    .wiersz-czlonka .dane small { color: var(--szary); display: block; }
    .wiersz-czlonka.nieaktywny .dane { color: var(--szary); text-decoration: line-through; }
    .wiersz-czlonka .akcje { display: flex; gap: 6px; }
    .wiersz-czlonka .akcje button {
      background: var(--tlo); border: 1px solid var(--linia); border-radius: 8px;
      padding: 8px 10px; font-size: .8rem; cursor: pointer; min-height: 40px;
    }
    .oplucie { font-size: .78rem; color: var(--szary); margin-top: 4px; }
    .lista > .oplucie { grid-column: 1 / -1; text-align: center; }

    /* ---------- ekrany specjalne ---------- */
    .ekran-pelny {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; gap: 12px;
    }
    .ekran-pelny h1 { font-size: 1.25rem; margin: 0; }
    .ekran-pelny p { color: var(--szary); margin: 0; max-width: 420px; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid var(--linia); border-top-color: var(--akcent);
      animation: obrot 1s linear infinite;
    }
    @keyframes obrot { to { transform: rotate(360deg); } }
    .blad-tekst { color: var(--blad); }
    .demo { background: #fff3cd; color: #7a5b00; border-radius: 8px; padding: 6px 10px; font-size: .8rem; }
  </style>
</head>
<body>
  <div id="app"><div class="ekran-pelny"><div class="spinner"></div><p>Ładowanie…</p></div></div>

<script>
/* =================================================================
 * Dziennik Obecności KTS Gliwice — frontend v0.1.4
 * Tryby: GAS (google.script.run) | DEMO (mock, do przeglądu bez arkusza)
 * ================================================================= */

var WERSJA_UI = 'v0.1.4';
var GAS = (typeof google !== 'undefined' && google.script && google.script.run);
var DEMO = !GAS;

/* ------------------------------------------------ stan aplikacji */
var S = {
  stan: null,            // odpowiedź dajStan()
  data: '',              // RRRR-MM-DD wybranej daty
  grupa: '*',            // '*' = wszystkie
  sortowanie: 'imie',    // 'imie' | 'nazwisko'
  szukane: '',
  trybCzlonkowie: false, // czy otwarty modal członków
  tapy: {},              // { idZawodnika: {n: liczba tapów, t: timestamp} }
  timery: {},            // timery resetu tapów per zawodnik
  wisiace: {},           // { idZawodnika: 'zapis'|'usun'|'blad' }
  kolejkaDemo: []        // demo: symulacja opóźnień sieciowych
};

/* tryb demo: przykładowe dane (ŻADNE dane osobowe nie opuszczają repo prywatnego —
   to fikcyjne nazwiska wygenerowane do podglądu interfejsu) */
function stanDemo() {
  // grupy jak z zakładki Grupy: {kod, nazwa, dni} (nazwa pusta = pokazujemy kod)
  var grupy = [
    { kod: 'GR1', nazwa: '', dni: '' },
    { kod: 'GR2', nazwa: '', dni: '' }
  ];
  var ludzie = [
    ['Adam', 'Nowak', 'GR1', true], ['Barbara', 'Kowalska', 'GR1', true],
    ['Cezary', 'Wiśniewski', 'GR1', true], ['Dorota', 'Lewandowska', 'GR1', true],
    ['Emil', 'Zieliński', 'GR2', true], ['Filip', 'Szymański', 'GR2', true],
    ['Grażyna', 'Woźniak', 'GR2', true], ['Henryk', 'Dąbrowski', 'GR2', true],
    ['Irena', 'Kozłowska', 'GR2', true], ['Jan', 'Mazur', 'GR1', true],
    ['Katarzyna', 'Jankowska', 'GR1', false], ['Leon', 'Wójcik', 'GR1', true]
  ];
  var zawodnicy = ludzie.map(function (l, i) {
    return { id: 'P' + (1000 + i), imie: l[0], nazwisko: l[1], grupa: l[2], aktywny: l[3], dolaczyl: '2026-11-20', uwagi: '' };
  });
  var dzis = lokalnaData(new Date());
  var obecnosci = {};
  obecnosci[dzis] = ['P1000', 'P1004', 'P1007'];
  var wczoraj = new Date(); wczoraj.setDate(wczoraj.getDate() - 1);
  obecnosci[lokalnaData(wczoraj)] = ['P1000', 'P1002', 'P1005', 'P1010'];
  return {
    wersja: WERSJA_UI, email: 'demo@przyklad.pl', dzisiaj: dzis,
    zawodnicy: zawodnicy, obecnosci: obecnosci, grupy: grupy,
    ustawienia: { DNI_TRENINGOWE: '1,3,4,5', SORTOWANIE_DOMYSLNE: 'imie' },
    brakDostepu: false
  };
}

/* ------------------------------------------------ warstwa serwera */
function wywolaj(fn, arg1, arg2, arg3, cb) {
  if (DEMO) { wywolajDemo(fn, arg1, arg2, arg3, cb); return; }
  google.script.run
    .withSuccessHandler(function (w) { cb(null, w); })
    .withFailureHandler(function (e) { cb(e); })
    [fn](arg1, arg2, arg3);
}

function wywolajDemo(fn, arg1, arg2, arg3, cb) {
  setTimeout(function () {
    var r;
    try { r = logikaDemo(fn, arg1, arg2, arg3); cb(null, r); }
    catch (e) { cb(e); }
  }, 250 + Math.random() * 300);
}

function logikaDemo(fn, a, b) {
  var st = S.stan;
  var dzis = lokalnaData(new Date());
  // w demo źródłem prawdy jest żywy stan (jak arkusz w GAS): dajStan po zmianach
  // zwraca stan bieżący, a nie świeży mock — inaczej kasowałby każdą zmianę
  if (fn === 'dajStan') return st || stanDemo();
  if (fn === 'zapiszObecnosc') {
    st.obecnosci[a] = st.obecnosci[a] || [];
    if (st.obecnosci[a].indexOf(b) === -1) st.obecnosci[a].push(b);
    return { ok: true, istnialo: false };
  }
  if (fn === 'usunObecnosc') {
    var t = st.obecnosci[a] || [];
    var i = t.indexOf(b);
    if (i !== -1) t.splice(i, 1);
    return { ok: true, usunieto: i !== -1 };
  }
  // demo: ensureGrupa — nowa grupa trafia do stanu jak do zakładki Grupy
  function dodajGrupeDemo(kod) {
    kod = (kod || 'GR1').toUpperCase();
    var jest = st.grupy.some(function (g) { return g.kod === kod; });
    if (!jest) st.grupy.push({ kod: kod, nazwa: '', dni: '' });
    return kod;
  }
  if (fn === 'dodajCzlonka') {
    var id = 'P' + Date.now();
    var grupa = dodajGrupeDemo(a[2]);
    st.zawodnicy.push({ id: id, imie: a[0], nazwisko: a[1], grupa: grupa, aktywny: true, dolaczyl: dzis, uwagi: '' });
    return { ok: true, id: id };
  }
  if (fn === 'edytujCzlonka') {
    st.zawodnicy.forEach(function (z) {
      if (z.id === a) { z.imie = b[0]; z.nazwisko = b[1]; z.grupa = dodajGrupeDemo(b[2]); }
    });
    return { ok: true };
  }
  if (fn === 'przelaczAktywnosc') {
    st.zawodnicy.forEach(function (z) { if (z.id === a) z.aktywny = b; });
    return { ok: true };
  }
  throw new Error('Nieznana funkcja demo: ' + fn);
}

/* ------------------------------------------------ pomocnicze */
function lokalnaData(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function polskieDni(dzien) {
  return ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'][dzien];
}
function dlugaData(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return iso;
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return polskieDni(d.getDay()) + ', ' + Number(m[3]) + ' ' +
    ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca',
     'sierpnia', 'września', 'października', 'listopada', 'grudnia'][d.getMonth()] +
    ' ' + m[1];
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ------------------------------------------------ render główny */
function renderuj() {
  var app = document.getElementById('app');

  if (!S.stan) {
    app.innerHTML = '<div class="ekran-pelny"><div class="spinner"></div><p>Ładowanie…</p></div>';
    return;
  }
  if (S.stan.brakDostepu) {
    // wyróżniamy przyczynę: brak dostępu do PLIKU arkusza vs brak na białej liście
    if (S.stan.arkuszBrak) {
      app.innerHTML =
        '<div class="ekran-pelny">' +
        '<h1>Połącz z arkuszem</h1>' +
        '<p>Jesteś zalogowany jako <b>' + esc(S.stan.email || '(nieznane konto)') + '</b>.</p>' +
        '<p>Ten dziennik zapisuje dane w arkuszu Google klubu. Twoje konto nie ma jeszcze dostępu do tego arkusza.</p>' +
        '<p><b>Co zrobić:</b> poproś Tomka (właściciela arkusza) o udostępnienie Ci pliku arkusza z prawem <b>Edytora</b>, a potem wróć i odśwież tę stronę.</p>' +
        '<button class="btn-glowny" style="padding:12px 20px;border:none;border-radius:10px" onclick="location.reload()">Spróbuj ponownie</button>' +
        '<p style="font-size:.8rem">' + WERSJA_UI + '</p>' +
        '</div>';
      return;
    }
    app.innerHTML =
      '<div class="ekran-pelny">' +
      '<h1>Brak dostępu</h1>' +
      (S.stan.pustaLista
        ? '<p>Biała lista jest jeszcze pusta. Dodaj swój adres e-mail w zakładce <b>Biala_lista</b> w arkuszu, a potem odśwież tę stronę.</p>'
        : '<p>Konto <b>' + esc(S.stan.email || '(nieznane)') + '</b> nie ma dostępu do dziennika. Skontaktuj się z administratorem klubu.</p>') +
      '<p style="font-size:.8rem">' + WERSJA_UI + '</p>' +
      '</div>';
    return;
  }

  if (S.trybCzlonkowie) { renderujCzlonkow(app); return; }

  var lista = widoczni();
  var obecnosciDzien = (S.stan.obecnosci[S.data] || []);
  var ileObecnych = lista.filter(function (z) { return obecnosciDzien.indexOf(z.id) !== -1; }).length;

  var html =
    '<div class="topbar">' +
      '<div class="rzad1">' +
        '<span class="tytul">Obecność</span>' +
        '<span class="licznik">' + ileObecnych + '/' + lista.length + ' obecnych</span>' +
        '<button class="btn-ikona" id="btn-czlonkowie" title="Członkowie">👥 Członkowie</button>' +
      '</div>' +
      '<div class="rzad2">' +
        '<span class="btn-data">📅 <input type="date" class="data-input" id="data" value="' + S.data + '" max="' + lokalnaData(new Date()) + '"></span>' +
        '<input class="szukaj" id="szukaj" type="search" placeholder="Szukaj…" value="' + esc(S.szukane) + '">' +
        '<div class="przelacznik">' +
          '<button id="sort-imie" class="' + (S.sortowanie === 'imie' ? 'on' : '') + '">A→Z imię</button>' +
          '<button id="sort-nazwisko" class="' + (S.sortowanie === 'nazwisko' ? 'on' : '') + '">A→Z nazwisko</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="grupy">' +
      przyciskGrupy('*', 'Wszystkie') +
      // grupy: obiekty {kod, nazwa} — na chipie pokazujemy nazwę, jeśli jest
      S.stan.grupy.map(function (g) {
        return przyciskGrupy(g.kod, g.nazwa || g.kod);
      }).join('') +
    '</div>' +
    '<div class="lista">' +
      lista.map(kafelHtml).join('') +
      (lista.length === 0 ? '<p class="oplucie" style="text-align:center">Brak zawodników spełniających kryteria.</p>' : '') +
    '</div>' +
    '<div class="stopka">' +
      '<p class="wersja">' + (DEMO ? '<span class="demo">TRYB DEMO — dane przykładowe</span> · ' : '') +
        esc(S.stan.email) + ' · ' + WERSJA_UI + '</p>' +
      '<div class="wiersz">' +
        '<button class="on" id="stopka-obecnosc">📋 Obecność</button>' +
        '<button id="stopka-czlonkowie">👥 Członkowie</button>' +
      '</div>' +
    '</div>';

  app.innerHTML = html;
  podpinz();
}

function przyciskGrupy(kod, etykieta) {
  return '<button data-grupa="' + esc(kod) + '" class="' + (S.grupa === kod ? 'on' : '') + '">' + esc(etykieta) + '</button>';
}

function widoczni() {
  var sortImie = S.sortowanie === 'imie';
  var lista = S.stan.zawodnicy.filter(function (z) {
    if (!z.aktywny) return false;
    if (S.grupa !== '*' && z.grupa !== S.grupa) return false;
    if (S.szukane) {
      var sz = S.szukane.toLowerCase();
      if ((z.imie + ' ' + z.nazwisko).toLowerCase().indexOf(sz) === -1) return false;
    }
    return true;
  });
  lista.sort(function (a, b) {
    return sortImie
      ? a.imie.localeCompare(b.imie, 'pl') || a.nazwisko.localeCompare(b.nazwisko, 'pl')
      : a.nazwisko.localeCompare(b.nazwisko, 'pl') || a.imie.localeCompare(b.imie, 'pl');
  });
  return lista;
}

function kafelHtml(z) {
  var obecnosciDzien = S.stan.obecnosci[S.data] || [];
  var obecny = obecnosciDzien.indexOf(z.id) !== -1;
  var tap = S.tapy[z.id];
  var klasy = ['kafel'];
  var ikonaStatusu;

  if (S.wisiace[z.id] === 'blad') {
    klasy.push('blad');
    ikonaStatusu = obecny ? '✓' : '·';
  } else if (S.wisiace[z.id]) {
    klasy.push('synchronizacja');
    ikonaStatusu = obecny ? '✓' : '·';
  } else if (obecny && tap && tap.n > 0) {
    klasy.push('potwierdz');
    ikonaStatusu = 'USUŃ? ' + (tap.n) + '/3';
  } else if (obecny) {
    klasy.push('obecny');
    ikonaStatusu = '✓';
  } else {
    ikonaStatusu = '·';
  }

  // „USUŃ? n/3" to tabletka, nie kółko — klasa zamiast stylu inline
  var statusHtml = (ikonaStatusu && ikonaStatusu.indexOf('USUŃ') === 0)
    ? '<span class="status usun">' + ikonaStatusu + '</span>'
    : '<span class="status">' + ikonaStatusu + '</span>';

  // Dwa wiersze nazwy (ekran 9:16): wiersz 1 = imię albo nazwisko (wg
  // sortowania), wiersz 2 = drugi człon + status obok, wiersz 3 = grupa.
  var pierwsza = S.sortowanie === 'nazwisko' ? z.nazwisko : z.imie;
  var druga = S.sortowanie === 'nazwisko' ? z.imie : z.nazwisko;

  var html =
    '<button class="' + klasy.join(' ') + '" data-id="' + esc(z.id) + '">' +
      '<span class="nazwa"><b>' + esc(pierwsza) + '</b></span>' +
      '<span class="wiersz-nazwy">' +
        '<span class="nazwa"><b>' + esc(druga) + '</b></span>' +
        statusHtml +
      '</span>' +
      '<span class="grupa-etykieta">' + esc(z.grupa) + '</span>' +
    '</button>';

  if (S.wisiace[z.id] === 'blad') {
    html += '<div class="ponow">Nie zapisano obecności ' + esc(z.imie) + '. <button data-ponow="' + esc(z.id) + '">Ponów</button></div>';
  }
  return html;
}

/* ------------------------------------------------ interakcje: kafelki */
function tapZawodnika(z) {
  var dzien = S.stan.obecnosci[S.data] || [];
  var obecny = dzien.indexOf(z.id) !== -1;

  if (!obecny) {
    // 1 tap = obecny (optymistycznie)
    dzien.push(z.id);
    S.stan.obecnosci[S.data] = dzien;
    S.wisiace[z.id] = 'zapis';
    renderuj();
    wywolaj('zapiszObecnosc', z.id, S.data, null, function (e) {
      delete S.wisiace[z.id];
      if (e) {
        // utrata dostępu do arkusza w trakcie sesji → ekran „Połącz z arkuszem"
        if (String(e.message) === 'ARKUSZ_BRAK') {
          odswiezStan(function () { renderuj(); });
          return;
        }
        S.wisiace[z.id] = 'blad';
      }
      renderuj();
    });
    return;
  }

  // obecny → licznik tapów do 3
  var tap = S.tapy[z.id] || { n: 0, t: 0 };
  tap.n += 1;
  tap.t = Date.now();
  S.tapy[z.id] = tap;
  if (S.timery[z.id]) clearTimeout(S.timery[z.id]);
  if (tap.n < 3) {
    // reset po 2 s bezczynności
    S.timery[z.id] = setTimeout(function () {
      delete S.tapy[z.id];
      delete S.timery[z.id];
      renderuj();
    }, 2000);
    renderuj();
    return;
  }

  // 3 tapy → usuń
  delete S.tapy[z.id];
  clearTimeout(S.timery[z.id]);
  delete S.timery[z.id];
  var idx = dzien.indexOf(z.id);
  if (idx !== -1) dzien.splice(idx, 1);
  S.stan.obecnosci[S.data] = dzien;
  S.wisiace[z.id] = 'usun';
  renderuj();
  wywolaj('usunObecnosc', z.id, S.data, null, function (e) {
    delete S.wisiace[z.id];
    if (e) {
      if (String(e.message) === 'ARKUSZ_BRAK') {
        odswiezStan(function () { renderuj(); });
        return;
      }
      S.wisiace[z.id] = 'blad';
    }
    renderuj();
  });
}

/* ------------------------------------------------ modal: członkowie */
function renderujCzlonkow(app) {
  var sortImie = S.sortowanie !== 'nazwisko';
  var wszyscy = S.stan.zawodnicy.slice().sort(function (a, b) {
    return sortImie
      ? a.imie.localeCompare(b.imie, 'pl') || a.nazwisko.localeCompare(b.nazwisko, 'pl')
      : a.nazwisko.localeCompare(b.nazwisko, 'pl') || a.imie.localeCompare(b.imie, 'pl');
  });
  var aktywni = wszyscy.filter(function (z) { return z.aktywny; });
  var nieaktywni = wszyscy.filter(function (z) { return !z.aktywny; });

  app.innerHTML =
    '<div class="topbar">' +
      '<div class="rzad1">' +
        '<span class="tytul">Członkowie (' + aktywni.length + ')</span>' +
        '<button class="btn-ikona" id="btn-dodaj">＋ Dodaj</button>' +
      '</div>' +
      '<div class="rzad2"><input class="szukaj" id="szukaj-czlonkowie" type="search" placeholder="Szukaj…" value="' + esc(S.szukane) + '"></div>' +
    '</div>' +
    '<div class="lista">' +
      wszyscy.filter(function (z) {
        if (!S.szukane) return true;
        var sz = S.szukane.toLowerCase();
        return (z.imie + ' ' + z.nazwisko).toLowerCase().indexOf(sz) !== -1;
      }).map(function (z) {
        return '<div class="wiersz-czlonka' + (z.aktywny ? '' : ' nieaktywny') + '" data-id="' + esc(z.id) + '">' +
          '<div class="dane"><b>' + (S.sortowanie === 'nazwisko'
            ? esc(z.nazwisko + ' ' + z.imie)
            : esc(z.imie + ' ' + z.nazwisko)) + '</b>' +
          '<small>' + esc(z.grupa) + ' · dołączył: ' + esc(z.dolaczyl || '—') + (z.aktywny ? '' : ' · NIEAKTYWNY') + '</small></div>' +
          '<div class="akcje">' +
            '<button data-akcja="edytuj" data-id="' + esc(z.id) + '">✏️ Edytuj</button>' +
            '<button data-akcja="przelacz" data-id="' + esc(z.id) + '">' + (z.aktywny ? '🚫 Deaktywuj' : '✔ Aktywuj') + '</button>' +
          '</div></div>';
      }).join('') +
      (nieaktywni.length ? '<p class="oplucie">Osoby nieaktywne nie pojawiają się na liście obecności; ich historia zostaje.</p>' : '') +
    '</div>' +
    '<div class="stopka">' +
      '<p class="wersja">' + (DEMO ? '<span class="demo">TRYB DEMO — dane przykładowe</span> · ' : '') +
        esc(S.stan.email) + ' · ' + WERSJA_UI + '</p>' +
      '<div class="wiersz">' +
        '<button id="stopka-obecnosc">📋 Obecność</button>' +
        '<button class="on" id="stopka-czlonkowie">👥 Członkowie</button>' +
      '</div>' +
    '</div>';

  podpinzCzlonkow();
}

function modalDodajEdytuj(z) {
  var tlo = document.createElement('div');
  tlo.className = 'tlo-modal';
  // grupy: obiekty {kod, nazwa} z zakładki Grupy (nowa grupa zapisze się
  // do arkusza sama — backend: ensureGrupa w dodajCzlonka/edytujCzlonka)
  var kody = S.stan.grupy.map(function (g) { return g.kod; });
  var grupyOpcje = S.stan.grupy.slice();
  if (z && z.grupa && kody.indexOf(z.grupa) === -1) {
    grupyOpcje.push({ kod: z.grupa, nazwa: '' });
  }
  tlo.innerHTML =
    '<div class="modal">' +
      '<h2>' + (z ? 'Edytuj członka' : 'Dodaj członka') + '</h2>' +
      '<label>Imię</label><input id="f-imie" value="' + esc(z ? z.imie : '') + '" autocomplete="off">' +
      '<label>Nazwisko</label><input id="f-nazwisko" value="' + esc(z ? z.nazwisko : '') + '" autocomplete="off">' +
      '<label>Grupa</label>' +
      '<select id="f-grupa">' +
        grupyOpcje.map(function (g) {
          return '<option value="' + esc(g.kod) + '">' + esc(g.nazwa ? g.nazwa + ' (' + g.kod + ')' : g.kod) + '</option>';
        }).join('') +
        '<option value="__nowa">+ nowa grupa (wpisz niżej)…</option>' +
      '</select>' +
      '<label id="lbl-nowa" style="display:none">Nazwa nowej grupy (np. GR3)</label>' +
      '<input id="f-nowa" style="display:none" placeholder="GR3" autocomplete="off">' +
      '<div class="przyciski">' +
        '<button class="btn-drugi" id="f-anuluj">Anuluj</button>' +
        '<button class="btn-glowny" id="f-zapisz">' + (z ? 'Zapisz zmiany' : 'Dodaj') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(tlo);

  var sel = tlo.querySelector('#f-grupa');
  if (z) sel.value = z.grupa;
  sel.addEventListener('change', function () {
    var nowa = sel.value === '__nowa';
    tlo.querySelector('#lbl-nowa').style.display = nowa ? 'block' : 'none';
    tlo.querySelector('#f-nowa').style.display = nowa ? 'block' : 'none';
  });
  tlo.querySelector('#f-anuluj').addEventListener('click', function () { tlo.remove(); });
  tlo.querySelector('#f-zapisz').addEventListener('click', function () {
    var imie = tlo.querySelector('#f-imie').value.trim();
    var nazwisko = tlo.querySelector('#f-nazwisko').value.trim();
    var grupa = sel.value === '__nowa'
      ? tlo.querySelector('#f-nowa').value.trim().toUpperCase().replace(/\s+/g, '')
      : sel.value;
    if (!imie || !nazwisko) { alert('Imię i nazwisko są wymagane.'); return; }
    if (!grupa) grupa = 'GR1';

    var zakoncz = function (e) {
      tlo.remove();
      if (e) {
        if (String(e.message) === 'ARKUSZ_BRAK') {
          odswiezStan(function () { renderuj(); });
          return;
        }
        alert('Błąd zapisu: ' + e.message);
        return;
      }
      odswiezStan(function () { renderuj(); });
    };
    if (z) wywolaj('edytujCzlonka', z.id, [imie, nazwisko, grupa], null, zakoncz);
    else wywolaj('dodajCzlonka', [imie, nazwisko, grupa], null, null, zakoncz);
  });
}

/* ------------------------------------------------ odświeżanie */
function odswiezStan(cb) {
  wywolaj('dajStan', null, null, null, function (e, stan) {
    if (e) {
      var app = document.getElementById('app');
      // ARKUSZ_BRAK z wywołania (np. po utracie dostępu w trakcie sesji)
      // → ten sam ekran „Połącz z arkuszem", co przy starcie
      if (String(e && e.message) === 'ARKUSZ_BRAK') {
        S.stan = { wersja: WERSJA_UI, email: '', arkuszBrak: true, brakDostepu: true };
        renderuj();
        if (cb) cb();
        return;
      }
      app.innerHTML = '<div class="ekran-pelny"><h1 class="blad-tekst">Błąd połączenia</h1>' +
        '<p>' + esc(e.message || e) + '</p>' +
        '<button class="btn-glowny" style="padding:12px 20px;border:none;border-radius:10px" onclick="location.reload()">Odśwież</button></div>';
      return;
    }
    S.stan = stan;
    if (!S.data) S.data = stan.dzisiaj || lokalnaData(new Date());
    if (!S.sortowanie) S.sortowanie = (stan.ustawienia && stan.ustawienia.SORTOWANIE_DOMYSLNE) || 'imie';
    var zapisane = null;
    try { zapisane = localStorage.getItem('sortowanie'); } catch (ign) {}
    if (zapisane === 'imie' || zapisane === 'nazwisko') S.sortowanie = zapisane;
    if (cb) cb();
  });
}

/* ------------------------------------------------ podpinanie zdarzeń */
function podpinz() {
  var el = function (id) { return document.getElementById(id); };

  if (el('data')) el('data').addEventListener('change', function () {
    S.data = this.value || lokalnaData(new Date());
    renderuj();
  });
  if (el('szukaj')) el('szukaj').addEventListener('input', function () {
    S.szukane = this.value;
    // odświeżamy tylko listę (bez przebudowy inputu, żeby nie tracić fokusa)
    var kontener = document.querySelector('.lista');
    var lista = widoczni();
    kontener.innerHTML = lista.map(kafelHtml).join('') ||
      '<p class="oplucie" style="text-align:center">Brak zawodników spełniających kryteria.</p>';
    podpinzKafelki();
    aktualizujLicznik();
  });
  if (el('sort-imie')) el('sort-imie').addEventListener('click', function () {
    ustawSortowanie('imie');
  });
  if (el('sort-nazwisko')) el('sort-nazwisko').addEventListener('click', function () {
    ustawSortowanie('nazwisko');
  });
  if (el('btn-czlonkowie')) el('btn-czlonkowie').addEventListener('click', function () {
    S.trybCzlonkowie = true; S.szukane = ''; renderuj();
  });
  if (el('stopka-obecnosc')) el('stopka-obecnosc').addEventListener('click', function () {
    S.trybCzlonkowie = false; S.szukane = ''; renderuj();
  });
  if (el('stopka-czlonkowie')) el('stopka-czlonkowie').addEventListener('click', function () {
    S.trybCzlonkowie = true; S.szukane = ''; renderuj();
  });

  document.querySelectorAll('.grupy button').forEach(function (b) {
    b.addEventListener('click', function () {
      S.grupa = this.getAttribute('data-grupa');
      renderuj();
    });
  });

  podpinzKafelki();
  podpinzPonow();
}

function podpinzKafelki() {
  document.querySelectorAll('.kafel').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = this.getAttribute('data-id');
      var z = null;
      S.stan.zawodnicy.forEach(function (x) { if (x.id === id) z = x; });
      if (z) tapZawodnika(z);
    });
  });
}

function podpinzPonow() {
  document.querySelectorAll('button[data-ponow]').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = this.getAttribute('data-ponow');
      delete S.wisiace[id];
      var z = null;
      S.stan.zawodnicy.forEach(function (x) { if (x.id === id) z = x; });
      if (z) tapZawodnika(z);
    });
  });
}

function ustawSortowanie(w) {
  S.sortowanie = w;
  try { localStorage.setItem('sortowanie', w); } catch (ign) {}
  renderuj();
}

function aktualizujLicznik() {
  var el = document.querySelector('.licznik');
  if (!el) return;
  var lista = widoczni();
  var dzien = S.stan.obecnosci[S.data] || [];
  var ile = lista.filter(function (z) { return dzien.indexOf(z.id) !== -1; }).length;
  el.textContent = ile + '/' + lista.length + ' obecnych';
}

function podpinzCzlonkow() {
  var sz = document.getElementById('szukaj-czlonkowie');
  if (sz) sz.addEventListener('input', function () {
    S.szukane = this.value;
    // przebudowa listy bez ruszania inputu; kolejność zgoda z S.sortowanie
    var sortImie = S.sortowanie !== 'nazwisko';
    var wszyscy = S.stan.zawodnicy.slice().sort(function (a, b) {
      return sortImie
        ? a.imie.localeCompare(b.imie, 'pl') || a.nazwisko.localeCompare(b.nazwisko, 'pl')
        : a.nazwisko.localeCompare(b.nazwisko, 'pl') || a.imie.localeCompare(b.imie, 'pl');
    });
    var html = wszyscy.filter(function (z) {
      if (!S.szukane) return true;
      var s = S.szukane.toLowerCase();
      return (z.imie + ' ' + z.nazwisko).toLowerCase().indexOf(s) !== -1;
    }).map(function (z) {
      return '<div class="wiersz-czlonka' + (z.aktywny ? '' : ' nieaktywny') + '" data-id="' + esc(z.id) + '">' +
        '<div class="dane"><b>' + (S.sortowanie === 'nazwisko'
          ? esc(z.nazwisko + ' ' + z.imie)
          : esc(z.imie + ' ' + z.nazwisko)) + '</b>' +
        '<small>' + esc(z.grupa) + ' · dołączył: ' + esc(z.dolaczyl || '—') + (z.aktywny ? '' : ' · NIEAKTYWNY') + '</small></div>' +
        '<div class="akcje">' +
          '<button data-akcja="edytuj" data-id="' + esc(z.id) + '">✏️ Edytuj</button>' +
          '<button data-akcja="przelacz" data-id="' + esc(z.id) + '">' + (z.aktywny ? '🚫 Deaktywuj' : '✔ Aktywuj') + '</button>' +
        '</div></div>';
    }).join('');
    var kontener = document.querySelector('.lista');
    kontener.innerHTML = html + (wszyscy.some(function (z) { return !z.aktywny; })
      ? '<p class="oplucie">Osoby nieaktywne nie pojawiają się na liście obecności; ich historia zostaje.</p>' : '');
    podpinzAkcjeCzlonkow();
  });

  document.getElementById('btn-dodaj').addEventListener('click', function () { modalDodajEdytuj(null); });
  document.getElementById('stopka-obecnosc').addEventListener('click', function () {
    S.trybCzlonkowie = false; S.szukane = ''; renderuj();
  });
  podpinzAkcjeCzlonkow();
}

function podpinzAkcjeCzlonkow() {
  document.querySelectorAll('button[data-akcja]').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = this.getAttribute('data-id');
      var akcja = this.getAttribute('data-akcja');
      var z = null;
      S.stan.zawodnicy.forEach(function (x) { if (x.id === id) z = x; });
      if (!z) return;

      if (akcja === 'edytuj') { modalDodajEdytuj(z); return; }

      // przelącz aktywność (deaktywacja = „anulowanie członka", historia zostaje)
      var nowyStan = !z.aktywny;
      if (nowyStan === false &&
          !confirm('Deaktywować ' + z.imie + ' ' + z.nazwisko + '?\nZniknie z listy obecności, historia zostanie zachowana.')) {
        return;
      }
      wywolaj('przelaczAktywnosc', z.id, nowyStan, null, function (e) {
        if (e) {
          if (String(e.message) === 'ARKUSZ_BRAK') {
            odswiezStan(function () { renderuj(); });
            return;
          }
          alert('Błąd: ' + e.message);
          return;
        }
        z.aktywny = nowyStan;
        renderuj();
      });
    });
  });
}

/* ------------------------------------------------ start */
(function start() {
  odswiezStan(function () { renderuj(); });
})();
</script>
